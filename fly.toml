# fly.toml app configuration file generated for ludo-backend
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "ludo-backend"
primary_region = "iad"

[build]
  # Use the Dockerfile in this directory

[env]
  SPRING_PROFILES_ACTIVE = "prod"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero when idle - this is a low-traffic hobby game, not a
  # steady-load service. Fly stops the machine when nothing's connected
  # (it won't stop one with active connections mid-game) and boots it
  # again on the next request. Trades a few seconds of cold-start latency
  # on the first connection after idle for not paying for 24/7 uptime
  # nobody's using.
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/actuator/health"
    protocol = "http"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
