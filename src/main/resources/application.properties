# Default Configuration (used when no profile is active)
spring.application.name=ludo-server

# Server Configuration
server.port=8080
server.address=0.0.0.0

# CORS Configuration - Allow local development by default
allowed.origins=http://localhost:3000,http://localhost:3001

# Logging Configuration
logging.level.root=INFO
logging.level.com.ludo=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.messaging=DEBUG

# WebSocket Configuration
spring.websocket.message-broker.enabled=true

# Default environment
app.environment=development

# Actuator - expose ONLY health. There is no Spring Security filter chain in
# this app (see LudoServerApplication's exclude), so nothing else stops a
# broader Actuator exposure (env, beans, mappings) from being publicly
# readable - keep this list to exactly what Fly's health check needs.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
