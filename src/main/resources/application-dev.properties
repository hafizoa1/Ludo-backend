# Development Configuration
spring.application.name=ludo-server

# Server port (default for local development)
server.port=8080

# CORS Configuration - Allow local frontend
allowed.origins=http://localhost:3000,http://localhost:3001

# Logging Configuration (verbose for development)
logging.level.root=INFO
logging.level.com.ludo=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.messaging=DEBUG

# WebSocket Configuration
spring.websocket.message-broker.enabled=true

# Development mode indicator
app.environment=development
