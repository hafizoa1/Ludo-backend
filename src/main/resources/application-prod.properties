# Production Configuration
spring.application.name=ludo-server

# Server Configuration
server.port=${PORT:8080}
server.address=0.0.0.0

# CORS Configuration - Set via Railway environment variables
# Format: comma-separated list of allowed origins
# Example: https://ludo-game.vercel.app,https://ludo-game-dev.vercel.app
allowed.origins=${ALLOWED_ORIGINS:http://localhost:3000}

# Logging Configuration (minimal for production)
logging.level.root=WARN
logging.level.com.ludo=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.messaging=INFO

# WebSocket Configuration
spring.websocket.message-broker.enabled=true

# Production mode indicator
app.environment=production

# Performance tuning
server.tomcat.threads.max=200
server.tomcat.accept-count=100
